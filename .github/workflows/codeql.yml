name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '24 3 * * 1'
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required to upload CodeQL code scanning results.
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e296a935590eb16afc0c0108289f68c87e2a89a5
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@e296a935590eb16afc0c0108289f68c87e2a89a5
