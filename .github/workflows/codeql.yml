name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '24 3 * * 1'
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required to upload CodeQL code scanning results.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@52485aec7be33610227643b0fe83936b8b5f061a
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@52485aec7be33610227643b0fe83936b8b5f061a
