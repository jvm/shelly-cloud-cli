name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    name: Publish npm and GitHub release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # Required to create/update the GitHub release.
      id-token: write # Required for npm Trusted Publishing/OIDC.
      attestations: write # Reserved for release artifact attestations.
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tarball: ${{ steps.meta.outputs.tarball }}
      sha256: ${{ steps.meta.outputs.sha256 }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install -g npm@11.6.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run pack:check
      - name: Pack npm tarball
        run: |
          npm pack
          shasum -a 256 -- ./*.tgz > checksums.txt
      - id: meta
        name: Collect artifact metadata
        run: |
          {
            version="${GITHUB_REF_NAME#v}"
            tarball="shelly-cloud-cli-${version}.tgz"
            sha256="$(awk '{print $1}' checksums.txt)"
            echo "version=${version}"
            echo "tarball=${tarball}"
            echo "sha256=${sha256}"
          } >> "$GITHUB_OUTPUT"
      - name: Upload GitHub release artifacts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" ./*.tgz checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" ./*.tgz checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Release ${GITHUB_REF_NAME}"
          fi
      - name: Publish to npm with Trusted Publishing
        run: env -u NODE_AUTH_TOKEN npm publish --provenance
  homebrew:
    name: Open Homebrew tap pull request
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Skip Homebrew tap update
        if: ${{ env.HOMEBREW_TAP_TOKEN == '' }}
        run: echo "HOMEBREW_TAP_TOKEN is not configured; skipping tap update."
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        with:
          repository: jvm/homebrew-tap
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        with:
          node-version: '22'
      - name: Generate formula
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        working-directory: tap
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          TARBALL: ${{ needs.publish.outputs.tarball }}
          SHA256: ${{ needs.publish.outputs.sha256 }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          scripts/render-shelly-cloud-cli-formula.sh \
            "$VERSION" \
            "https://github.com/jvm/shelly-cloud-cli/releases/download/${REF_NAME}/${TARBALL}" \
            "$SHA256"
      - name: Commit and open Homebrew tap pull request
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        working-directory: tap
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
          BRANCH_NAME: update-shelly-cloud-cli-${{ needs.publish.outputs.version }}
          PR_TITLE: Update shelly-cloud-cli to ${{ needs.publish.outputs.version }}
          PR_BODY: Updates shelly-cloud-cli formula from jvm/shelly-cloud-cli release ${{ github.ref_name }}.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_NAME"
          git add Formula/shelly-cloud-cli.rb
          if git diff --cached --quiet; then
            echo "No Homebrew tap changes to commit."
            exit 0
          fi
          git commit -m "$PR_TITLE"
          git push --force-with-lease origin "$BRANCH_NAME"
          if gh pr list --repo jvm/homebrew-tap --head "$BRANCH_NAME" --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo "Pull request already exists for $BRANCH_NAME"
          else
            gh pr create --repo jvm/homebrew-tap --base main --head "$BRANCH_NAME" --title "$PR_TITLE" --body "$PR_BODY"
          fi
